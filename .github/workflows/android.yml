name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Evaluated once here because secrets are not reliable in step-level `if`.
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compute version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION} (code ${GITHUB_RUN_NUMBER})"

      - name: Build debug APKs
        run: >
          ./gradlew --no-daemon assembleDebug
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Prepare debug artifacts
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/debug/*.apk; do
            base="$(basename "${apk}" .apk)"
            cp "${apk}" "dist/FloatTrans-${base#app-}-${{ steps.version.outputs.name }}.apk"
          done
          ls -lh dist

      # Optional: produce a release-signed APK when signing secrets exist.
      # Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in repository secrets.
      - name: Decode upload keystore
        if: env.HAS_SIGNING_KEY == 'true' && github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "${KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/release.jks"
          ls -l "$RUNNER_TEMP/release.jks"

      - name: Build signed release APKs
        if: env.HAS_SIGNING_KEY == 'true' && github.event_name != 'pull_request'
        env:
          FLOATTRANS_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          FLOATTRANS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLOATTRANS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FLOATTRANS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon assembleRelease
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Prepare release artifacts
        if: env.HAS_SIGNING_KEY == 'true' && github.event_name != 'pull_request'
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do
            base="$(basename "${apk}" .apk)"
            cp "${apk}" "dist/FloatTrans-${base#app-}-${{ steps.version.outputs.name }}.apk"
          done
          ls -lh dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FloatTrans-${{ steps.version.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
